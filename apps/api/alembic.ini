# Alembic configuration for ZESTORA API

[alembic]
# Path to migration scripts
script_location = migrations

# Prepend application root to sys.path
prepend_sys_path = .

# Version locations
version_locations = %(here)s/migrations/versions

# Version path separator
version_path_separator = os

# Dynamic sqlalchemy.url is populated in env.py from application settings
sqlalchemy.url = 

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
