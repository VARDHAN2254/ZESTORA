[project]
name = "zestora-worker"
version = "0.1.0"
description = "Celery background worker service for ZESTORA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["worker"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tasks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"
